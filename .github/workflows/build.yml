name: build-s3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 编译 ESP32-S3
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'
          cd firmware/esp32sx
          idf.py -D IDF_TARGET=esp32s3 -B build -D SDKCONFIG=build/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults" build merge-bin

      - name: 整理固件
        run: |
          mkdir out
          cp firmware/esp32sx/build/merged-binary.bin out/xrdap-esp32-s3.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: xrdap-esp32-s3
          path: out/xrdap-esp32-s3.bin
          if-no-files-found: error
